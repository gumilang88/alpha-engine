name: Alpha Engine - Token Insider
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install aiohttp

      - name: Run Alpha Engine
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python3 alpha_engine_gh.py

      - name: Commit seen_tokens.json
        run: |
          git config user.name "Alpha Engine Bot"
          git config user.email "bot@alpha-engine"
          git add seen_tokens.json
          git diff --staged --quiet || git commit -m "Update seen_tokens [skip ci]"
          git push